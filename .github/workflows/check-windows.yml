name: Check Windows

# The full Windows suite (x64 and ARM64: tests, clippy, the
# no-Visual-C++-runtime check), on every pull request and by hand. It needs
# no secret.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its stale run.
concurrency:
  group: check-windows-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  x64:
    name: x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo nextest run --release --profile ci
      - run: cargo build --locked --release
      - name: Check the executable needs no Visual C++ Redistributable or Vulkan loader, and is a GUI program
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $imports = & $dumpbin.FullName /dependents target\release\hex.exe
          $redist = $imports | Select-String -Pattern 'VCRUNTIME|MSVCP|vcomp'
          if ($redist) { throw "hex.exe imports Visual C++ runtime DLLs: $redist" }
          # The Vulkan loader comes with the graphics driver: imported at load
          # time, a missing or Vulkan 1.0 one stops Hex before main (#1240).
          # The window opens it itself, only when it draws with Vulkan.
          $static = ($imports -join "`n") -split 'delay load dependencies' | Select-Object -First 1
          if ($static -match 'vulkan-1\.dll') { throw "hex.exe imports vulkan-1.dll at load time" }
          # A GUI program, so opening Hex shows no console window (#850).
          $headers = & $dumpbin.FullName /headers target\release\hex.exe
          if (-not ($headers | Select-String -SimpleMatch 'subsystem (Windows GUI)')) { throw "hex.exe is not a Windows GUI program" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hex-windows-x86_64
          path: target/release/hex.exe

  arm64:
    name: ARM64
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --release --profile ci
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hex-windows-aarch64
          path: target/release/hex.exe
