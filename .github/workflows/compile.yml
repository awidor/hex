name: Compile

# A fast compile of the app on Linux, macOS, and Windows x64 (cargo clippy,
# warnings as errors) for every pull request that touches the build. The full
# suites are check-linux.yml, check-macos.yml, and check-windows.yml. None of
# them needs a secret.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".cargo/**"
      - "crates/**"
      - "src/**"
      - "native/**"
      - "resources/**"
      - "assets/**"
      - "nix/**"
      - "scripts/check-nix-git-pins.py"
      - "scripts/test-check-nix-git-pins.py"
      - ".github/workflows/compile.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its stale run.
concurrency:
  group: compile-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      OPENSSL_NO_VENDOR: "1"
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Nix Git pins
        run: |
          python3 scripts/test-check-nix-git-pins.py
          python3 scripts/check-nix-git-pins.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config python3 libasound2-dev \
            libssl-dev libgtk-3-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libxcursor-dev libxi-dev \
            libxrandr-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --bin hex -- -D warnings

  macos:
    name: macOS
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo clippy --locked --bin hex -- -D warnings

  windows:
    name: Windows x64
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - run: cargo clippy --locked --bin hex -- -D warnings
      # hex.com, the console entry point beside the GUI hex.exe.
      - run: cargo clippy --locked -p hex-console --all-targets -- -D warnings
      - run: cargo test --locked -p hex-console
